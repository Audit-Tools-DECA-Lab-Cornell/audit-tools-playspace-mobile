name: Refresh Vexo lockfile

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Regenerate lockfile
        run: bun install --lockfile-only --ignore-scripts

      - name: Verify Vexo is pinned
        run: |
          grep -q '"vexo-analytics": "1.5.7"' bun.lock
          grep -q '"vexo-analytics": \["vexo-analytics@1.5.7"' bun.lock

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(deps): pin vexo analytics to 1.5.7"
          git push origin HEAD:master
