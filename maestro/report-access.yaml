# Auditor-only native E2E flow for the Expo development build.
# Android appId: com.pratyush.sudhakar.audittoolsplayspacemobile
# iOS bundleId: com.pratyush.sudhakar.audit-tools-playspace-mobile
appId: com.pratyush.sudhakar.audittoolsplayspacemobile
---
- runFlow: login.yaml
- tapOn: "Reports"
- extendedWaitUntil:
      visible: ".*Report.*|.*Submitted.*|.*Riverside.*"
      timeout: 30000
- tapOn:
      text: ".*Riverside.*"
- extendedWaitUntil:
      visible: ".*Audit metadata.*"
      timeout: 30000
- scrollUntilVisible:
      element:
          text: ".*Playspace context.*"
      direction: DOWN
      timeout: 15000
- assertVisible: ".*How large is the playspace.*"
- assertVisible: ".*0-5 years.*"
- assertVisible: ".*Current weather conditions.*"
